name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Show error
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|error:|Could not|> " build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build error::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: OrionLite-apk
          path: app/build/outputs/apk/debug/*.apk
