<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 html,body{margin:0;height:100%;background:linear-gradient(135deg,#141a33,#07080f);font-family:system-ui,sans-serif;color:#fff;overflow:hidden}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;height:calc(100% - 28px);box-sizing:border-box}
 .t{border-radius:18px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.1)}
 .t:active{background:rgba(124,196,255,.35)}
 .i{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
</style></head><body>
<div class="grid">
 <div class="t" onclick="O.open('https://www.google.com')"><div class="i" style="background:#fff;color:#4285f4;font-weight:800">G</div>Browser</div>
 <div class="t" onclick="O.open('https://m.youtube.com')"><div class="i" style="background:#ff0033">▶</div>YouTube</div>
 <div class="t" onclick="O.open('https://www.instagram.com')"><div class="i" style="background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5)">◎</div>Instagram</div>
 <div class="t" onclick="O.open('https://www.google.com/maps')"><div class="i" style="background:#34a853">📍</div>Maps</div>
 <div class="t" onclick="O.open('https://en.m.wikipedia.org')"><div class="i" style="background:#eee;color:#000;font-family:serif">W</div>Wikipedia</div>
 <div class="t" onclick="O.recenter()"><div class="i" style="background:#3d8bff">🎯</div>Recenter</div>
 <div class="t" onclick="O.closeAll()"><div class="i" style="background:#555">🧹</div>Close all</div>
 <div class="t" onclick="O.settings()"><div class="i" style="background:#7c5cff">⚙</div>Settings</div>
</div>
<script>const O = window.OrionHome || {open(u){location.href=u},recenter(){},closeAll(){},settings(){}};</script>
</body></html>
